name: docs

on:
  # 每当 push 到 main 分支时触发部署
  push:
    branches: [main]
  # 手动触发部署
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          # "最近更新时间" 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 选择要使用的 node 版本
          node-version: 22
          # 使用仓库中的 package-lock.json 缓存 npm 依赖
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 运行构建脚本
      - name: Build VuePress site
        env:
          # GitHub runner 约有 7 GB 内存，为 Vite 的原生内存保留余量
          NODE_OPTIONS: --max-old-space-size=50000
        run: npm run docs:build

      - name: Create CNAME file
        run: echo "soda-official.top" > docs/.vuepress/dist/CNAME
      # 查看 workflow 的文档来获取更多信息
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # 部署到 gh-pages 分支
          target_branch: gh-pages
          # 部署目录为 VuePress 的默认输出目录
          build_dir: docs/.vuepress/dist
          # 添加 keep_history: false 配置来替代 force_orphan: true
          keep_history: false
        env:
          # @see https://docs.github.com/cn/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
